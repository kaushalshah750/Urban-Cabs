<mat-progress-bar mode="indeterminate" *ngIf="isLoading"></mat-progress-bar>
<div>
    <div class="d-flex align-items-center justify-content-center vh-100">
        <div class="login-box br20">
            <div class="bg-primary br20 h-100 d-flex justify-content-center  align-items-center">
                <div class="h-100 d-flex align-items-center" style="padding-top: 50px;">
                    <img src="../../../assets/logo/3.png" width="200px" alt="">
                </div>
                <div class="h-100 w-100 w-50 d-flex align-items-center justify-content-center" style="max-width: 70%;">
                    <form class="example-form" [formGroup]="createform">
                        <div class="w-100">
                            <mat-form-field class="example-full-width">
                                <mat-label>Email</mat-label>
                                <input type="email" matInput formControlName="email" placeholder="Ex. pat@example.com">
                            </mat-form-field>
                            <mat-form-field class="example-full-width">
                                <mat-label>Pasword</mat-label>
                                <input type="password" matInput formControlName="password" placeholder="Ex. pat@example.com">
                            </mat-form-field>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
