<div class="container-fluid">
  <section class="d-flex justify-content-end">
    <div class="example-button-row py-3">
      <button mat-flat-button color="primary" (click)="addExpense()">Add Expense</button>
    </div>
  </section>
  <div>
    <div>
      <table class="table">
        <thead>
          <tr>
            <th>Reason</th>
            <th>Amount</th>
            <th>Date</th>
            <th style="width: 70px;">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let expense of expenses">
            <td>{{expense.Reason}}</td>
            <td>{{expense.Amount | currency : 'INR'}}</td>
            <td>{{expense.Expense_Date | date: 'dd MMM yyyy'}}</td>
            <td>
              <mat-icon class="pointer" style="font-size: 20px;" (click)="editExpense(expense)">edit</mat-icon>
              <mat-icon class="pointer" style="font-size: 20px;" (click)="deleteExpense(expense)">delete</mat-icon>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
